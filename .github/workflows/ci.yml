name: CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      APP_ENV: testing
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check environment
        run: |
          echo "Checking runner environment..."
          pwd
          ls -la

      - name: Show environment
        run: echo "Running in $APP_ENV environment"

      - name: Check secret
        run: |
          if [ -n "$DEMO_SECRET" ]; then
            echo "Secret is available"
          else
            echo "Secret is missing"
            exit 1
          fi
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Conditional message
        if: success()
        run: echo "Tests succeeded, so this condition is true"

      - name: Build
        run: |
          mkdir -p build
          echo "CI build successful" > build/build.txt
          cat build/build.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-build
          path: build/
