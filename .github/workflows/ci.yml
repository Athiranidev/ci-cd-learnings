name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "45 10 * * *"

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    env:
      APP_ENV: testing
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show trigger
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Schedule: ${{ github.event.schedule }}"
      
      - name: Check environment
        run: |
          echo "Checking runner environment..."
          pwd
          ls -la

      - name: Show environment
        run: echo "Running in $APP_ENV environment"

      - name: Check secret
        run: |
          if [ -n "$DEMO_SECRET" ]; then
            echo "Secret is available"
          else
            echo "Secret is missing"
            exit 1
          fi
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: pytest
          
      - name: Conditional message
        if: success()
        run: echo "Tests succeeded, so this condition is true"

    
  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t athiranidev/ci-python-app:latest .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        run: docker push athiranidev/ci-python-app:latest

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull athiranidev/ci-python-app:latest
            sudo docker stop ci-cd-flask-app || true
            sudo docker rm ci-cd-flask-app || true
            sudo docker run -d \
              --name ci-cd-flask-app \
              -p 5000:5000 \
              athiranidev/ci-python-app:latest
