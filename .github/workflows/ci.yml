name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      APP_ENV: testing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check environment
        run: |
          echo "Checking runner environment..."
          pwd
          ls -la

      - name: Show environment
        run: echo "Running in $APP_ENV environment"

      - name: Check secret
        run: |
          if [ -n "$DEMO_SECRET" ]; then
            echo "Secret is available"
          else
            echo "Secret is missing"
            exit 1
          fi
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Conditional message
        if: success()
        run: echo "Tests succeeded, so this condition is true"

      - name: Build Docker image
        run: docker build -t athiranidev/ci-python-app:latest .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        run: docker push athiranidev/ci-python-app:latest
