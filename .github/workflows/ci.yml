name: CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check environment
        run: |
          echo "Checking runner environment..."
          pwd
          ls -la

      - name: Run CI test
        run: ./test.sh

      - name: Build
        run: echo "Build started"
