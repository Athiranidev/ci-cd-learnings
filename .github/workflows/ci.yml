name: CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check environment
        run: |
          echo "Checking runner environment..."
          pwd
          ls -la

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Build
        run: echo "Build started"
